name: Generate Overture catalogue batch

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_overture.py"
      - "scripts/test_import_overture.py"
      - "scripts/requirements-import.txt"
      - "supabase/migrations/20260921183500_catalog_seed.sql"
      - ".github/workflows/catalog-overture-batch.yml"
  workflow_dispatch:
    inputs:
      rollout_batch:
        description: "Gradual city rollout; ignored when explicit cities are supplied"
        required: true
        default: "batch-1"
        type: choice
        options:
          - batch-1
          - batch-2
      cities:
        description: "Optional comma-separated city slugs; blank processes the current rollout batch"
        required: false
        type: string
      limit_per_category:
        description: "Maximum records per top-level category and city"
        required: true
        default: "10"
        type: string
      minimum_confidence:
        description: "Minimum Overture confidence"
        required: true
        default: "0.80"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-import.txt
      - run: python -m pip install -r scripts/requirements-import.txt
      - name: Test quality gates
        run: python -m unittest discover -s scripts -p 'test_import_overture.py'
      - name: Generate idempotent SQL
        env:
          CITY_INPUT: ${{ inputs.cities }}
          ROLLOUT_BATCH: ${{ inputs.rollout_batch }}
          LIMIT_PER_CATEGORY: ${{ inputs.limit_per_category }}
          MINIMUM_CONFIDENCE: ${{ inputs.minimum_confidence }}
        run: |
          limit_per_category="${LIMIT_PER_CATEGORY:-10}"
          minimum_confidence="${MINIMUM_CONFIDENCE:-0.80}"
          if [[ -z "$CITY_INPUT" ]]; then
            case "${ROLLOUT_BATCH:-batch-1}" in
              batch-1)
                CITY_INPUT="istanbul-tr,madrid-es,amsterdam-nl,milan-it,prague-cz,vienna-at,berlin-de,dublin-ie"
                ;;
              batch-2)
                CITY_INPUT="venice-it,munich-de,copenhagen-dk,budapest-hu,brussels-be,edinburgh-gb,porto-pt,stockholm-se"
                ;;
              *)
                echo "Unknown rollout batch: $ROLLOUT_BATCH" >&2
                exit 2
                ;;
            esac
          fi
          city_args=()
          if [[ -n "$CITY_INPUT" ]]; then
            IFS=',' read -ra requested <<< "$CITY_INPUT"
            for city in "${requested[@]}"; do
              city_args+=(--city "${city// /}")
            done
          fi
          python scripts/import_overture.py \
            --local-cities \
            "${city_args[@]}" \
            --limit-per-category "$limit_per_category" \
            --min-confidence "$minimum_confidence" \
            --sql-output overture_catalog_batch.sql \
            --quality-report overture_catalog_quality_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: overture-catalogue-sql
          path: |
            overture_catalog_batch.sql
            overture_catalog_quality_report.json
          if-no-files-found: error
          retention-days: 14
